name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11.8
      uses: actions/setup-python@v6
      with:
        python-version: "3.11.8"
        cache: "pip"
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
    - name: Unit tests
      env:
        BROKER_URL: ${{ secrets.BROKER_URL }}
        PORT: ${{ secrets.PORT }}
        TOPIC: ${{ secrets.TOPIC }}
        USER: ${{ secrets.USER }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        pytest tests/unit_tests --cov=src --cov-report=term-missing --cov-fail-under=80

    - name: Integration tests
      env:
        BROKER_URL: ${{ secrets.BROKER_URL }}
        PORT: ${{ secrets.PORT }}
        TOPIC: ${{ secrets.TOPIC }}
        USER: ${{ secrets.USER }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        pytest tests/integration_tests --cov=src --cov-report=term-missing

    - name: System tests
      env:
        BROKER_URL: ${{ secrets.BROKER_URL }}
        PORT: ${{ secrets.PORT }}
        TOPIC: ${{ secrets.TOPIC }}
        USER: ${{ secrets.USER }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        pytest tests/system_tests --cov=src --cov-report=term-missing

  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11.8
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.8"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  quality:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11.8
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.8"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Run bandit
        run: |
          bandit -r src --severity-level medium
      
  containerize:
    needs: [ test, lint, quality ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
      - name: Build container image
        run: |
          apptainer build astralog.sif astralog.def
      - name: Save container image as artifact
        uses: actions/upload-artifact@v7
        with:
          name: astralog-container
          path: astralog.sif
          if-no-files-found: error
          retention-days: 1