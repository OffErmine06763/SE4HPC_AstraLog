name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11.8
      uses: actions/setup-python@v5
      with:
        python-version: "3.11.8"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
  containerize:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install apptainer
        run: |
          sudo apt-get update && sudo apt-get install -y curl rpm2cpio cpio
          curl -s https://raw.githubusercontent.com/apptainer/apptainer/main/tools/install-unprivileged.sh | bash -s - install-dir
      - name: Build container image
        run: |
          export PATH="$HOME/.local/apptainer/bin:$PATH"
          apptainer build astralog.sif astralog.def
      - name: Save container image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: astralog-container
          path: astralog.sif
          if-no-files-found: error
          retention-days: 1
